name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved, not just the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation where this feature would help. What are you trying
        to do that you can't do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: If you have a specific solution in mind, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Feature area
      options:
        - CPU affinity / process management
        - GPU monitoring
        - Network monitoring
        - System tray
        - Settings / configuration
        - Session reports
        - UI / dashboard
        - Performance / resource usage of the app itself
        - Other
    validations:
      required: true
