name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the fields below.

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2 (Build 26100), Windows 10 22H2
    validations:
      required: true

  - type: input
    id: cpu-model
    attributes:
      label: CPU model
      description: e.g. AMD Ryzen 7 5800X3D, Intel Core i9-13900K
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. Enable CPU pinning
        3. Start a game
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: event-log
    attributes:
      label: Event log (optional)
      description: Copy the contents of the event log from the app's footer if relevant.
      render: text

  - type: dropdown
    id: pinning-state
    attributes:
      label: Was CPU pinning enabled when the bug occurred?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: checkboxes
    id: admin
    attributes:
      label: Admin rights
      options:
        - label: The app was running as Administrator
