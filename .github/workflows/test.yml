name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0

      - name: Run unit tests
        shell: pwsh
        run: |
          # The test file self-bootstraps a nested Invoke-Pester when run via
          # `pwsh -File`. Set its guard so this outer run discovers the tests
          # instead of the bootstrap swallowing them (which reported 0 tests).
          $env:GAMING_OPT_PESTER_RUNNING = '1'
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'gaming-optimizer.tests.ps1'
          $cfg.Run.PassThru = $true
          # JUnitXml matches the java-junit reporter used in the next step
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'JUnitXml'
          $cfg.TestResult.OutputPath = 'TestResults.xml'
          $result = Invoke-Pester -Configuration $cfg
          "Pester $((Get-Module Pester).Version): $($result.PassedCount)/$($result.TotalCount) passed, $($result.FailedCount) failed"
          exit $result.FailedCount

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Tests
          path: TestResults.xml
          reporter: java-junit
