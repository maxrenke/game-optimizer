name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Run tests
        run: dotnet test Tests/GameOptimizer.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish (win-x64)
        run: >
          dotnet publish GameOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64

      - name: Zip release
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath GameOptimizer-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Gaming Optimizer ${{ github.ref_name }}"
          body: |
            ## Gaming Optimizer ${{ github.ref_name }}

            ### Download
            Grab `GameOptimizer-${{ github.ref_name }}-win-x64.zip`, extract anywhere, and run `GameOptimizer.exe`.

            > **Windows SmartScreen warning**: The binary is unsigned. Click "More info" -> "Run anyway" to launch.
            > This is expected for open-source apps without a paid code-signing certificate.

            ### Requirements
            - Windows 10 1809 or Windows 11
            - x64 CPU
            - Administrator rights (for CPU affinity/priority changes)

            ### What's new
            See [CHANGELOG.md](https://github.com/maxrenke/game-optimizer/blob/main/CHANGELOG.md) for details.
          files: GameOptimizer-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
